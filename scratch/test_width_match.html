
<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  :root {
    --page-width: 1400px;
    --page-margin: 40px;
    --font-heading--family: 'Helvetica', Arial, sans-serif;
    --font-body--family: 'Aptos', Arial, sans-serif;
  }
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: var(--font-body--family);
  }
  
  /* GRID SECTION */
  .lifestyle-grid-section {
    width: 100%;
    box-sizing: border-box;
    padding-top: 24px;
    padding-bottom: 24px;
  }
  .lifestyle-grid-container {
    width: 100%;
    max-width: var(--page-width);
    margin: 0 auto;
    box-sizing: border-box;
    padding-left: var(--page-margin);
    padding-right: var(--page-margin);
  }
  .lifestyle-grid__grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, auto);
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
  }
  .lifestyle-grid__card {
    position: relative;
    width: 100%;
    aspect-ratio: 3/2;
    overflow: hidden;
    background: #e2e8f0;
  }
  .lifestyle-grid__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  /* PRODUCT LIST SECTION */
  .section--page-width {
    width: 100%;
    box-sizing: border-box;
    padding-top: 48px;
    padding-bottom: 48px;
    background: #F0F4F6;
  }
  .product-list-container {
    max-width: var(--page-width);
    margin: 0 auto;
    padding-left: var(--page-margin);
    padding-right: var(--page-margin);
    box-sizing: border-box;
  }
  .section-resource-list__header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
  }
  .section-resource-list__header h2 {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: #0c4168;
    margin: 0;
    line-height: 1.2;
    letter-spacing: 0.5px;
  }
  .section-resource-list__header a {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #0c4168;
    text-transform: uppercase;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .product-carousel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .product-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .product-card__image {
    aspect-ratio: 3/4;
    background: #e5e7eb;
    position: relative;
    overflow: hidden;
  }
  .product-card__title {
    font-size: 15px;
    font-weight: 700;
    color: #0c4168;
    margin: 4px 0 0 0;
    line-height: 1.3;
  }
  .product-card__price {
    font-size: 14px;
    font-weight: 700;
    color: #111111;
    margin: 4px 0 0 0;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <!-- 2x2 GRID -->
  <section class='lifestyle-grid-section'>
    <div class='lifestyle-grid-container'>
      <div class='lifestyle-grid__grid'>
        <div class='lifestyle-grid__card' style='background:#10b981;'><div style='padding:20px;color:#fff;font-weight:bold;'>Top Left (600x400)</div></div>
        <div class='lifestyle-grid__card' style='background:#3b82f6;'><div style='padding:20px;color:#fff;font-weight:bold;'>Top Right (600x400)</div></div>
        <div class='lifestyle-grid__card' style='background:#8b5cf6;'><div style='padding:20px;color:#fff;font-weight:bold;'>Bottom Left (600x400)</div></div>
        <div class='lifestyle-grid__card' style='background:#ec4899;'><div style='padding:20px;color:#fff;font-weight:bold;'>Bottom Right (600x400)</div></div>
      </div>
    </div>
  </section>

  <!-- PRODUCT LIST BELOW (BESTSELLERS) -->
  <section class='section--page-width'>
    <div class='product-list-container'>
      <div class='section-resource-list__header'>
        <h2>Bestsellers</h2>
        <a href='#'>VIEW ALL</a>
      </div>
      <div class='product-carousel'>
        <div class='product-card'>
          <div class='product-card__image' style='background:#ddd;'></div>
          <p class='product-card__title'>Nocturnal Life Men's Tee</p>
          <p class='product-card__price'>Rs. 899</p>
        </div>
        <div class='product-card'>
          <div class='product-card__image' style='background:#ddd;'></div>
          <p class='product-card__title'>Pookie but Spooky Women's Tee</p>
          <p class='product-card__price'>Rs. 799</p>
        </div>
        <div class='product-card'>
          <div class='product-card__image' style='background:#ddd;'></div>
          <p class='product-card__title'>Need a Break Men's Tee</p>
          <p class='product-card__price'>Rs. 899</p>
        </div>
        <div class='product-card'>
          <div class='product-card__image' style='background:#ddd;'></div>
          <p class='product-card__title'>Retro Reboot Boy's Tee</p>
          <p class='product-card__price'>Rs. 899</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
