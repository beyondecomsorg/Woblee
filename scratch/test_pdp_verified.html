<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDP Offers Match Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFFFFF;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .pdp-preview-container {
      width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .atc-btn {
      width: 100%;
      height: 48px;
      background-color: #0C4168;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
    }
    .pdp-urgency-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .pdp-urgency-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background-color: #F8FAFC !important;
      border: 1px solid #E2E8F0 !important;
      border-radius: 0 !important;
      box-sizing: border-box;
      min-width: 0;
    }
    .pdp-urgency-text {
      font-size: 12.5px;
      color: #0C4168;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ab-carousel-container {
      position: relative;
      width: 100%;
    }
    .ab-marquee-content {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ab-marquee-content::-webkit-scrollbar { display: none; }
    .ab-card {
      flex: 0 0 calc(50% - 5px);
      background-color: #F8FAFC !important;
      border: 1px solid #E2E8F0 !important;
      border-radius: 0 !important;
      padding: 10px 14px;
    }
    .ab-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ab-code-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #0C4168;
      text-decoration: underline;
    }
    .ab-description {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }
    .ab-progress-track {
      width: 100%;
      height: 3px;
      background-color: #E2E8F0;
      border-radius: 2px;
      margin-top: 10px;
    }
    .ab-progress-thumb {
      height: 100%;
      width: 33%;
      background-color: #94A3B8;
      border-radius: 2px;
    }
    .accordion-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-top: 1px solid #E2E8F0;
      font-size: 13.5px;
      font-weight: 700;
      color: #0C4168;
    }
  </style>
</head>
<body>
  <div class="pdp-preview-container">
    <button class="atc-btn">🛍 ADD TO CART</button>

    <div class="pdp-urgency-row">
      <div class="pdp-urgency-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3" fill="#22c55e"></circle>
        </svg>
        <span class="pdp-urgency-text">43 people viewing this right now</span>
      </div>

      <div class="pdp-urgency-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#22c55e">
          <path d="M5 7H19V20C19 20.5523 18.5523 21 18 21H6C5.44772 21 5 20.5523 5 20V7Z"/>
          <path d="M8.5 8.5V5.5C8.5 3.567 10.067 2 12 2C13.933 2 15.5 3.567 15.5 5.5V8.5" stroke="#22c55e" stroke-width="2"/>
        </svg>
        <span class="pdp-urgency-text">Hurry, only a few still left in stock</span>
      </div>
    </div>

    <div class="ab-carousel-container">
      <div class="ab-marquee-content">
        <div class="ab-card">
          <div class="ab-card-header">
            <span style="display:inline-block; width:18px; height:18px; background:#22c55e; border-radius:2px; transform:rotate(-45deg);"></span>
            <span class="ab-code-name">DIWALI10</span>
          </div>
          <p class="ab-description">Get <strong>10% OFF</strong>, valid on all products</p>
        </div>

        <div class="ab-card">
          <div class="ab-card-header">
            <span style="display:inline-block; width:18px; height:18px; background:#22c55e; border-radius:2px; transform:rotate(-45deg);"></span>
            <span class="ab-code-name">EXTRA15</span>
          </div>
          <p class="ab-description">Buy 2, get <strong>15% OFF</strong></p>
        </div>
      </div>
      <div class="ab-progress-track">
        <div class="ab-progress-thumb"></div>
      </div>
    </div>

    <div class="accordion-row">
      <span>PRODUCT OVERVIEW</span>
      <span>+</span>
    </div>
  </div>
</body>
</html>
