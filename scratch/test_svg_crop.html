<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Grid Verification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }

  /* 2x2 LIFESTYLE GRID SECTION */
  .lifestyle-grid-section {
    width: 100%;
    padding-top: 24px;
    padding-bottom: 24px;
    overflow-x: clip;
  }
  @media screen and (max-width: 768px) {
    .lifestyle-grid-section {
      padding-top: 16px;
      padding-bottom: 16px;
    }
  }
  .lifestyle-grid-container {
    width: 100%;
    max-width: 1500px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 20px;
    padding-right: 20px;
  }
  @media screen and (max-width: 768px) {
    .lifestyle-grid-container {
      padding-left: 12px;
      padding-right: 12px;
    }
  }
  .lifestyle-grid__grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
  }
  @media screen and (max-width: 768px) {
    .lifestyle-grid__grid {
      gap: 8px;
    }
  }
  .lifestyle-grid__card {
    position: relative;
    width: 100%;
    min-width: 0;
    overflow: hidden;
  }
  .lifestyle-grid__media-wrap {
    position: relative;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    background: #f3f4f6;
  }
  .lifestyle-grid__img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  /* REFERENCE HOMEPAGE SECTION (custom-editorial-seaction) */
  .ess-section {
    width: 100%;
    padding: 30px 0;
  }
  .ess-inner {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 6px;
    max-width: 1500px;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
  }
  @media screen and (max-width: 768px) {
    .ess-inner {
      padding-left: 12px;
      padding-right: 12px;
    }
  }
  .ess-left {
    background: #0c4168;
    min-height: 240px;
    color: #fff;
    padding: 20px;
  }
  .ess-right {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .ess-item {
    background: #e2e8f0;
    min-height: 110px;
  }
</style>
</head>
<body>
  <!-- 2x2 GRID SECTION WITH SVG 3:2 IMAGES -->
  <section class='lifestyle-grid-section'>
    <div class='lifestyle-grid-container'>
      <div class='lifestyle-grid__grid'>
        <!-- Card 1 -->
        <div class='lifestyle-grid__card'>
          <div class='lifestyle-grid__media-wrap'>
            <svg class='lifestyle-grid__img' viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg'>
              <rect width='600' height='400' fill='#74cc14'/>
              <rect width='600' height='30' fill='#2f6b08'/>
              <rect y='370' width='600' height='30' fill='#2f6b08'/>
              <!-- Left and right marker bars to test for cropping -->
              <rect width='20' height='400' fill='#1b4003'/>
              <rect x='580' width='20' height='400' fill='#1b4003'/>
              <text x='300' y='220' font-size='80' font-weight='bold' text-anchor='middle' fill='#000'>3:2</text>
            </svg>
          </div>
        </div>
        <!-- Card 2 -->
        <div class='lifestyle-grid__card'>
          <div class='lifestyle-grid__media-wrap'>
            <svg class='lifestyle-grid__img' viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg'>
              <rect width='600' height='400' fill='#74cc14'/>
              <rect width='600' height='30' fill='#2f6b08'/>
              <rect y='370' width='600' height='30' fill='#2f6b08'/>
              <rect width='20' height='400' fill='#1b4003'/>
              <rect x='580' width='20' height='400' fill='#1b4003'/>
              <text x='300' y='220' font-size='80' font-weight='bold' text-anchor='middle' fill='#000'>3:2</text>
            </svg>
          </div>
        </div>
        <!-- Card 3 -->
        <div class='lifestyle-grid__card'>
          <div class='lifestyle-grid__media-wrap'>
            <svg class='lifestyle-grid__img' viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg'>
              <rect width='600' height='400' fill='#74cc14'/>
              <rect width='600' height='30' fill='#2f6b08'/>
              <rect y='370' width='600' height='30' fill='#2f6b08'/>
              <rect width='20' height='400' fill='#1b4003'/>
              <rect x='580' width='20' height='400' fill='#1b4003'/>
              <text x='300' y='220' font-size='80' font-weight='bold' text-anchor='middle' fill='#000'>3:2</text>
            </svg>
          </div>
        </div>
        <!-- Card 4 -->
        <div class='lifestyle-grid__card'>
          <div class='lifestyle-grid__media-wrap'>
            <svg class='lifestyle-grid__img' viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg'>
              <rect width='600' height='400' fill='#74cc14'/>
              <rect width='600' height='30' fill='#2f6b08'/>
              <rect y='370' width='600' height='30' fill='#2f6b08'/>
              <rect width='20' height='400' fill='#1b4003'/>
              <rect x='580' width='20' height='400' fill='#1b4003'/>
              <text x='300' y='220' font-size='80' font-weight='bold' text-anchor='middle' fill='#000'>3:2</text>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- REFERENCE SECTION BELOW -->
  <section class='ess-section'>
    <div class='ess-inner'>
      <div class='ess-left'>Every season comes with a new perspective.</div>
      <div class='ess-right'>
        <div class='ess-item'></div>
        <div class='ess-item'></div>
        <div class='ess-item'></div>
        <div class='ess-item'></div>
      </div>
    </div>
  </section>
</body>
</html>
