<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>400x400 Grid Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 40px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .lifestyle-grid-section {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .lifestyle-grid-container {
      width: 100%;
      max-width: 810px; /* 400 * 2 + 10px gap */
      margin: 0 auto;
    }
    .lifestyle-grid__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 400px));
      grid-template-rows: repeat(2, minmax(0, 400px));
      gap: 10px;
      width: 100%;
      max-width: 810px;
      margin: 0 auto;
    }
    .lifestyle-grid__card {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      overflow: hidden;
      border-radius: 0px;
      background: #ffffff;
    }
    .lifestyle-grid__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
